<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Knight's No-Return Quest</title>
<style>
:root{--n:6;--cell:52px;--gold:#d9b33d;--silver:#e6e5dd;--dark:#090704;--ink:#fff6d7;--edge:#ffe083}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;min-height:100%;background:#090704;color:var(--ink);font-family:Georgia,serif}body{background:radial-gradient(circle at 50% 58%,rgba(116,76,28,.55),rgba(8,7,4,.9) 55%,#020201),linear-gradient(130deg,#120d06,#060503)}#app{min-height:100svh;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:10px}.panel{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 15px;border:1px solid rgba(255,224,131,.5);border-radius:18px;background:rgba(0,0,0,.72);box-shadow:0 14px 36px #000}h1{font-size:clamp(28px,8vw,52px);line-height:.92;margin:0 0 7px;text-shadow:0 3px 4px #000}.sub{font-size:clamp(16px,4.3vw,23px)}.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;font-size:13px}.stats span{padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,232,170,.2)}.buttons{display:flex;flex-direction:column;gap:8px}button{font:800 19px Georgia,serif;color:var(--ink);background:linear-gradient(#846523,#49310f);border:2px solid rgba(255,224,131,.62);border-radius:14px;padding:11px 17px;box-shadow:0 7px 14px #0008}button:active{transform:translateY(1px)}#msg{text-align:center;min-height:38px;font-weight:800;font-size:clamp(16px,4.3vw,22px);text-shadow:0 2px 4px #000}.wrap{flex:1;display:grid;place-items:center;min-height:0}.area{position:relative;width:calc((var(--n) + 2)*var(--cell));height:calc((var(--n) + 2)*var(--cell));max-width:96vw;max-height:62svh}.board,.extras{position:absolute;left:var(--cell);top:var(--cell);display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell))}.cell,.extra{width:var(--cell);height:var(--cell);display:grid;place-items:center;position:relative}.cell{border:1px solid #0004;background:var(--silver);box-shadow:inset 0 0 18px #fff7}.cell.gold{background:var(--gold);box-shadow:inset 0 0 18px #fff5}.cell.used,.cell.block{background:#050403!important;box-shadow:inset 0 0 15px #000;border-color:#2a2110}.cell.legal{outline:4px solid #fff2a8;z-index:2;animation:pulse 1s infinite alternate}.cell.legal:after,.extra.legal:after{content:'TAP';font:900 13px Arial,sans-serif;letter-spacing:.5px;color:#201500;background:#ffe889;border-radius:999px;padding:3px 6px;box-shadow:0 0 13px #fff}.extra{border:2px dashed rgba(255,232,165,.45);background:rgba(255,226,129,.09);border-radius:9px}.extra.start,.extra.finish{box-shadow:0 0 18px rgba(255,221,111,.3)}.extra.legal{outline:4px solid #fff2a8;animation:pulse 1s infinite alternate}.label{position:absolute;font:bold 10px Arial,sans-serif;letter-spacing:.7px;color:#ffe9a6;text-shadow:0 1px 3px #000;bottom:-17px;left:50%;transform:translateX(-50%)}.knight{position:absolute;width:var(--cell);height:var(--cell);display:grid;place-items:center;z-index:10;transition:left .18s ease,top .18s ease;filter:drop-shadow(0 9px 9px #000)}.piece{width:82%;height:82%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--cell)*.64);background:radial-gradient(circle at 35% 24%,#d4944c,#5b2c12 55%,#1f0d05);border:2px solid #c58a43;color:#201006;text-shadow:0 1px 0 #dfa76b}@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}.help{font-size:13px;opacity:.85;text-align:center;line-height:1.25}@media(max-width:430px){.panel{padding:12px}.buttons button{font-size:17px;padding:10px 14px}.area{max-height:58svh}}
</style>
</head>
<body><div id="app"><div class="panel"><div><h1>Knight's No-Return Quest</h1><div class="sub">Tap a glowing square. Never land twice.</div><div class="stats"><span id="levelText">Level 1</span><span id="sizeText">6×6</span><span id="moveText">Moves 0</span></div></div><div class="buttons"><button id="undo">Undo</button><button id="reset">Reset</button></div></div><div id="msg">Find the path to FINISH.</div><div class="wrap"><div class="area" id="area"><div class="extras" id="extras"></div><div class="board" id="board"></div><div class="knight" id="knight"><div class="piece">♞</div></div></div></div><div class="help">START and FINISH are outside the board. Used squares turn black. Later levels begin with blocked squares.</div></div><script>
const boardEl=document.getElementById('board'),extrasEl=document.getElementById('extras'),knightEl=document.getElementById('knight'),area=document.getElementById('area'),msg=document.getElementById('msg');
const levelText=document.getElementById('levelText'),sizeText=document.getElementById('sizeText'),moveText=document.getElementById('moveText');
const jumps=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const sizes=[6,5,4,3,6,5,4,6,5,4,6,5,4];let state,level=0;
function inside(p,n){return p.r>=0&&p.c>=0&&p.r<n&&p.c<n}function key(p){return p.r+','+p.c}function same(a,b){return a.r==b.r&&a.c==b.c}function movesFrom(p){return jumps.map(j=>({r:p.r+j[0],c:p.c+j[1]}))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeLevel(L){let n=sizes[L%sizes.length],blockedRatio=L<4?0:(L<7?.45:.55),attempt=0;while(attempt++<500){let side=L%4,start,finish;if(side==0){start={r:-2,c:Math.floor(n/2)-1};finish={r:n+1,c:Math.ceil(n/2)}}else if(side==1){start={r:Math.floor(n/2),c:-2};finish={r:Math.ceil(n/2)-1,c:n+1}}else if(side==2){start={r:n+1,c:Math.floor(n/2)};finish={r:-2,c:Math.ceil(n/2)-1}}else{start={r:Math.floor(n/2)-1,c:n+1};finish={r:Math.ceil(n/2),c:-2}}let path=[start],used=new Set(),cur=start,steps=Math.max(5,Math.floor(n*n*(L<4?.45:.32)));let ok=true;for(let s=0;s<steps;s++){let opts=movesFrom(cur).filter(p=>inside(p,n)&&!used.has(key(p)));if(!opts.length){ok=false;break}opts.sort((a,b)=>movesFrom(a).filter(x=>inside(x,n)&&!used.has(key(x))).length-movesFrom(b).filter(x=>inside(x,n)&&!used.has(key(x))).length);let pick=opts[Math.floor(Math.random()*Math.min(3,opts.length))];used.add(key(pick));path.push(pick);cur=pick}if(!ok)continue;let exits=movesFrom(cur).filter(p=>same(p,finish));if(!exits.length)continue;path.push(finish);let blocked=new Set();if(blockedRatio>0){let all=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++){let k=r+','+c;if(!used.has(k))all.push(k)}shuffle(all);let count=Math.floor(n*n*blockedRatio);for(let k of all.slice(0,count))blocked.add(k)}return{n,start,finish,path,blocked}}return{n,start:{r:-2,c:2},finish:{r:n+1,c:n-2},path:[],blocked:new Set()}}
function setup(){let l=makeLevel(level);state={...l,pos:l.start,visited:new Set(),history:[],moves:0};document.documentElement.style.setProperty('--n',state.n);render();msg.textContent='Find the path to FINISH.'}
function legalMoves(){return movesFrom(state.pos).filter(p=>same(p,state.finish)||(inside(p,state.n)&&!state.visited.has(key(p))&&!state.blocked.has(key(p))))}
function placeOf(p){let cell=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'))||52;return{left:(p.c+1)*cell,top:(p.r+1)*cell}}
function resizeCell(){let maxW=Math.min(innerWidth*.94,620),maxH=Math.max(270,innerHeight*.58);let c=Math.floor(Math.min(maxW/(state.n+2),maxH/(state.n+2)));c=Math.max(34,Math.min(74,c));document.documentElement.style.setProperty('--cell',c+'px')}
function render(){resizeCell();levelText.textContent='Level '+(level+1);sizeText.textContent=state.n+'×'+state.n+(state.blocked.size?' / blocked':'');moveText.textContent='Moves '+state.moves;boardEl.innerHTML='';extrasEl.innerHTML='';let leg=legalMoves().map(key);for(let r=0;r<state.n;r++)for(let c=0;c<state.n;c++){let d=document.createElement('div'),k=r+','+c;d.className='cell '+((r+c)%2?'gold':'silver')+(state.visited.has(k)?' used':'')+(state.blocked.has(k)?' block':'')+(leg.includes(k)?' legal':'');d.onclick=()=>tap({r,c});boardEl.appendChild(d)}for(let ex of [{p:state.start,t:'START',cl:'start'},{p:state.finish,t:'FINISH',cl:'finish'}]){let d=document.createElement('div'),p=placeOf(ex.p);d.className='extra '+ex.cl+(leg.some(k=>k==key(ex.p))?' legal':'');d.style.left=p.left+'px';d.style.top=p.top+'px';d.style.position='absolute';d.innerHTML='<span class="label">'+ex.t+'</span>';d.onclick=()=>tap(ex.p);extrasEl.appendChild(d)}let p=placeOf(state.pos);knightEl.style.left=p.left+'px';knightEl.style.top=p.top+'px';}
function tap(p){let ok=legalMoves().some(x=>same(x,p));if(!ok){msg.textContent='That square is not a knight move.';return}state.history.push({pos:{...state.pos},visited:new Set(state.visited),moves:state.moves});if(inside(p,state.n))state.visited.add(key(p));state.pos=p;state.moves++;if(same(p,state.finish)){msg.textContent='Level complete!';render();setTimeout(()=>{level++;setup()},650);return}let lm=legalMoves();msg.textContent=lm.length?'Good move. Keep going.':'No legal moves. Undo or reset.';render()}
document.getElementById('undo').onclick=()=>{let h=state.history.pop();if(!h)return;state.pos=h.pos;state.visited=h.visited;state.moves=h.moves;msg.textContent='Move undone.';render()};document.getElementById('reset').onclick=setup;addEventListener('resize',()=>state&&render());setup();
</script></body></html>
